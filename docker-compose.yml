version: "2"
services:
  builder:
    image: openlmis/dev:10
    volumes:
      - '.:/app'
      - 'gradlecache:/gradle'
    command:
      - './build.sh'
    environment:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  image:
    build: .
    image: openlmisrdc/fulfillment-extension
volumes:
  gradlecache:
    external: false
